<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Gatekeeper Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      min-width: 280px;
      padding: 20px;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    .container {
        text-align: center;
    }
    .status-title {
        font-weight: 300;
        font-size: 1.1em;
        margin-bottom: 15px;
    }
    .timer {
      font-size: 2em;
      font-weight: 700;
      margin: 10px 0;
      color: #4caf50;
      letter-spacing: 1px;
    }
    a {
      color: #0095ff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2em;
      transition: color 0.3s ease;
      display: block;
      word-wrap: break-word;
    }
    a:hover {
      color: #0073e6;
    }
    .problem-link-container {
        padding: 15px;
        background: #2a2a2a;
        border-radius: 8px;
        margin-top: 10px;
    }
    .unlock-text {
        margin-top: 15px;
        font-weight: 300;
        font-size: 0.9em;
        color: #aaa;
    }
    .freedom-text {
        color: #4caf50;
        font-weight: 700;
    }
    .difficulty-selector {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #333;
    }
    .difficulty-buttons {
        display: flex;
        justify-content: space-around;
    }
    .difficulty-btn {
        background-color: #333;
        color: #e0e0e0;
        border: 1px solid #555;
        padding: 8px 12px;
        font-size: 0.9em;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, border-color 0.3s ease;
        flex-grow: 1;
        margin: 0 5px;
    }
    .difficulty-btn:hover {
        background-color: #444;
        border-color: #777;
    }
    .difficulty-btn.selected {
        background-color: #007bff;
        border-color: #007bff;
        color: white;
        font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
      <div id="not-done" style="display:none;">
        <div class="status-title">Assigned Problem:</div>
        <div class="problem-link-container">
            <a id="problem-link" href="#" target="_blank"></a>
        </div>
        <div class="unlock-text">Solve this to unlock browsing!</div>
      </div>
      <div id="freedom" style="display:none;">
        <div class="status-title freedom-text">You have free browsing time!</div>
        <div class="timer" id="timer"></div>
        <div class="unlock-text">Time remaining.</div>
      </div>
  </div>

  <div class="difficulty-selector">
    <div class="status-title">Choose your difficulty:</div>
    <div class="difficulty-buttons">
      <button class="difficulty-btn" data-difficulty="Easy">Easy</button>
      <button class="difficulty-btn" data-difficulty="Medium">Medium</button>
      <button class="difficulty-btn" data-difficulty="Hard">Hard</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
